import java.time.Year

buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
    id 'idea'
    id 'java-library'
    id 'com.diffplug.spotless' version '8.11.0' apply false
    id 'biz.aQute.bnd.builder' version '7.5.0' apply false
    id 'com.vanniktech.maven.publish' version '0.37.0' apply false
}

defaultTasks 'clean', 'build'

def projGroup = 'org.tools4j'
def projVersion = file('version.txt').text.trim()

def agronaVersion = '2.7.1'
def slf4jVersion = '2.0.20'
def junitVersion = '6.1.3'
def mockitoVersion = '5.24.0'
def assertjVersion = '3.27.7'
def hdrHistogramVersion = '2.2.2'
def chronicleVersion = '2026.8'

static def getBuildJavaVersion() {
    def buildJavaVersion = JavaVersion.current().getMajorVersion()
    if (buildJavaVersion.indexOf('.') > 0) {
        buildJavaVersion = buildJavaVersion.substring(0, buildJavaVersion.indexOf('.'))
    }
    if (buildJavaVersion.indexOf('-') > 0) {
        buildJavaVersion = buildJavaVersion.substring(0, buildJavaVersion.indexOf('-'))
    }
    Integer.parseInt(buildJavaVersion)
}
int buildJavaVersion = getBuildJavaVersion()

ext {
    //gradle clean build publishToMavenCentral -PmavenCentralUsername=xxx -PmavenCentralPassword=xxx
    //(or set mavenCentralUsername/mavenCentralPassword, plus signing.* properties, in ~/.gradle/gradle.properties)
    //then: login/verify/release in https://central.sonatype.com/publishing/deployments

    isReleaseVersion = !projVersion.endsWith('-SNAPSHOT')

    println name + " version=" + projVersion + " release=" + isReleaseVersion
}

def projectPom = {
    name = 'mmap'
    // optionally artifactId can be defined here
    description = 'Memory mapped files used to implement off-heap low latency utilities such as queues'
    url = 'https://github.com/tools4j/mmap'

    scm {
        connection = 'scm:git:https://github.com/tools4j/mmap.git'
        developerConnection = 'scm:git:https://github.com/tools4j/mmap.git'
        url = 'https://github.com/tools4j/mmap.git'
    }

    licenses {
        license {
            name = 'The MIT License (MIT)'
            url = 'https://opensource.org/licenses/MIT'
        }
    }

    developers {
        developer {
            id = 'anton-anufriev'
            name = 'Antun Anufriev'
            email = 'anufriev@gmail.com'
            url = 'https://github.com/anton-anufriev'
        }
        developer {
            id = 'terzerm'
            name = 'Marco Terzer'
            email = 'terzerm@gmail.com'
            url = 'https://github.com/terzerm'
        }
    }
}

jar.enabled = false

allprojects {
    repositories {
        mavenCentral()
        mavenLocal()
    }
}

//all modules are published to maven central; mmap-perf is a command line application, not an OSGi bundle
def libraryProjects = subprojects.findAll { it.name != 'mmap-perf' }

configure(libraryProjects) {
    apply plugin: 'java-library'
    apply plugin: 'biz.aQute.bnd.builder'
}

subprojects {
    apply plugin: 'com.vanniktech.maven.publish'
    apply plugin: 'signing'

    signing {
        useGpgCmd()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'jacoco'

    dependencies {
        testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
        testImplementation "org.junit.jupiter:junit-jupiter-params:${junitVersion}"
        testImplementation "org.assertj:assertj-core:${assertjVersion}"
        testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    }

    group = projGroup
    version = projVersion

    tasks.withType(Jar).configureEach {
        enabled = true
        includeEmptyDirs = false
    }

    //class files for Java 17 whatever JDK builds them; not --release 17, which forbids the --add-exports below, and
    //without its warning that -source 17 does not check the API against Java 17 (the Java 17 build on CI does)
    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs.add('-Xlint:-options')
        if (JavaVersion.current().isJava9Compatible()) {
            options.compilerArgs.addAll(['--add-exports', 'java.base/java.lang.reflect=ALL-UNNAMED'])
            options.compilerArgs.addAll(['--add-exports', 'java.base/java.net=ALL-UNNAMED'])
            options.compilerArgs.addAll(['--add-exports', 'java.base/sun.nio.ch=ALL-UNNAMED'])
            options.compilerArgs.addAll(['--add-exports', 'java.base/jdk.internal.ref=ALL-UNNAMED'])
            options.compilerArgs.addAll(['--add-exports', 'jdk.unsupported/sun.misc=ALL-UNNAMED'])
        }
        options.encoding = 'UTF-8'
        options.deprecation = true
    }

    tasks.withType(Test) {

        enableAssertions = true
        jvmArgs('-Ddisable.thread.safety=true')

        jvmArgs('--add-opens', 'java.base/jdk.internal.misc=ALL-UNNAMED')
        jvmArgs('--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED')

        useJUnitPlatform {
            excludeTags 'perf'
        }

        testLogging {
            showStandardStreams = true
            exceptionFormat = 'full'
        }

        reports.html.required = false // Disable individual test reports
    }

    //runs the tests on another Java version than the build's, e.g. built on Java 25 like a release and tested on 17:
    //./gradlew build -PtestJava=17 (class files compiled against a newer JDK may call JDK internals that differ)
    if (project.hasProperty('testJava')) {
        def testJava = JavaLanguageVersion.of(project.property('testJava') as String)
        tasks.withType(Test).configureEach {
            javaLauncher = javaToolchains.launcherFor { languageVersion = testJava }
            enabled = name != 'ffmTest' || testJava.asInt() >= 22 //FFM needs Java 22 or later
        }
    }

    task perfTest(type: Test) {
        maxParallelForks = 1
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        jacoco.enabled = false

        enableAssertions = false
        jvmArgs('-Djvm.resource.tracing=false')
        jvmArgs('-Ddisable.thread.safety=true')

        if (JavaVersion.current().isJava9Compatible()) {
            jvmArgs('--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED')
            jvmArgs('--add-opens', 'java.base/java.net=ALL-UNNAMED')
            jvmArgs('--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED')
            jvmArgs('--add-opens', 'java.base/jdk.internal.ref=ALL-UNNAMED')
            jvmArgs('--add-opens', 'java.base/java.util.zip=ALL-UNNAMED')
            jvmArgs('--add-exports', 'jdk.unsupported/sun.misc=ALL-UNNAMED')
        }

        useJUnitPlatform {
            excludeTags = [] as Set // inherited from tasks.withType(Test) above
            includeTags 'perf'
        }
    }

    task profilerTest(type: Test) {
        maxParallelForks = 1
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        jacoco.enabled = false

        enableAssertions = false
        jvmArgs('-Djvm.resource.tracing=false')
        jvmArgs('-agentpath:/Applications/JProfiler.app/Contents/Resources/app/bin/macos/libjprofilerti.jnilib=port=8849')

        useJUnitPlatform {
            excludeTags = [] as Set // inherited from tasks.withType(Test) above
            includeTags 'perf'
        }
    }

    jacoco {
        toolVersion = '0.8.16'
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
        }
    }

    spotless {
        def headerText = '/*\n' + file("${rootDir}/etc/LICENSE.template").readLines()
                .collect { it.isEmpty() ? ' *' : ' * ' + it }
                .join('\n')
                .replace('${year}', String.valueOf(Year.now().value)) + '\n */\n'
        java {
            licenseHeader(headerText)
        }
        // spotless java{} always skips package-info.java; '/**' delimiter keeps its package javadoc
        format 'packageInfo', {
            target 'src/*/java/**/package-info.java'
            licenseHeader(headerText, '(/\\*\\*|package )')
        }
    }

    compileJava.dependsOn spotlessApply

    javadoc {
        title = '<h1>mmap</h1>'
        options.bottom = "<i>Copyright &#169; 2020-" + Year.now().getValue() + " tools4j.org (Marco Terzer, Anton Anufriev). All Rights Reserved.</i>"
        options.encoding = 'UTF-8'
        options.docEncoding = 'UTF-8'
        options.charSet = 'UTF-8'
        if (JavaVersion.current().isJava10Compatible()) {
            options.addBooleanOption 'html5', true
            options.links("https://docs.oracle.com/en/java/javase/${buildJavaVersion}/docs/api/")
        }
        //doclint checks the packages that application code uses: in mmap-mapping and mmap-queue the api and config
        //packages, in mmap-core all packages but internal and impl ones, and all of mmap-perf
        def basePackage = 'org.tools4j.' + project.name.replace('-', '.')
        def doclintPackages = [
                'mmap-perf': basePackage,
                'mmap-core': "${basePackage}.*,-${basePackage}.internal,-${basePackage}.buffer.impl"
        ].getOrDefault(project.name, "${basePackage}.api,${basePackage}.config")
        options.addBooleanOption('Xdoclint:all', true)
        options.addBooleanOption("Xdoclint/package:${doclintPackages}", true)
        options.addStringOption('Xmaxwarns', '10000')
        //fail on any doclint warning, i.e. on missing or broken documentation in the public packages
        options.addBooleanOption('Werror', true)
    }

    task testJar(type: Jar, dependsOn: testClasses) {
        archiveClassifier.set "test-${base.archivesName}"
        from sourceSets.test.output
    }

    configurations {
        tests
    }

    artifacts {
        tests testJar
    }
}

project(':mmap-core') {
    //memory access through jdk.internal.misc.Unsafe, exported at run time with the same flag Agrona needs
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs.addAll(['--add-exports', 'java.base/jdk.internal.misc=ALL-UNNAMED'])
    }
    javadoc {
        options.addStringOption('-add-exports', 'java.base/jdk.internal.misc=ALL-UNNAMED')
    }

    //memory access through FFM (Java 22 or later): compiled only when building with Java 22 or later, into the same
    //jar, and loaded by name only when running on Java 22 or later; releases must therefore be built with Java 22 or
    //later, which publishing checks
    if (buildJavaVersion >= 22) {
        sourceSets {
            ffm {
                compileClasspath += sourceSets.main.output
            }
            test {
                runtimeClasspath += ffm.output
            }
        }

        tasks.named('compileFfmJava') {
            options.compilerArgs.clear() //FFM is public API, and --release forbids --add-exports
            options.release = 22
        }

        jar {
            from sourceSets.ffm.output
        }

        tasks.register('ffmTest', Test) {
            description = 'Runs the buffer tests with memory access through FFM'
            group = 'verification'
            testClassesDirs = sourceSets.test.output.classesDirs
            classpath = sourceSets.test.runtimeClasspath
            filter {
                includeTestsMatching 'org.tools4j.mmap.core.buffer.*'
            }
            systemProperty 'mmap.core.memoryAccess', 'FFM'
            jvmArgs = ['--enable-native-access=ALL-UNNAMED'] //and no --add-opens: FFM needs no JDK internals
        }

        tasks.named('check') {
            dependsOn 'ffmTest'
        }
    }

    tasks.matching { it.name.startsWith('publish') }.configureEach {
        doFirst {
            if (isReleaseVersion && buildJavaVersion < 22) {
                throw new GradleException("Releases of mmap-core must be built with Java 22 or later, to " +
                        "include memory access through FFM, not with Java ${buildJavaVersion}")
            }
        }
    }

    dependencies {
        //optional: logging listeners use SLF4J if present on the class path, and java.util.logging otherwise
        compileOnly "org.slf4j:slf4j-api:${slf4jVersion}"
        testImplementation "org.slf4j:slf4j-api:${slf4jVersion}"
        testRuntimeOnly "org.slf4j:slf4j-simple:${slf4jVersion}"
    }

    jar {
        bundle {
            // workaround for https://github.com/bndtools/bnd/issues/6346
            properties.put("project.group", provider({project.group}))
            bnd """
                Automatic-Module-Name:  org.tools4j.mmap.core
                Bundle-Name:            org.tools4j.mmap.core
                Bundle-SymbolicName:    org.tools4j.mmap.core
                Implementation-Title:   mmap
                Implementation-Vendor:  tools4j.org
                Implementation-Version: ${projVersion}
                Import-Package:         org.slf4j.*;resolution:=optional, java.lang.foreign;resolution:=optional, *
                # Java 17, not derived from the classes, as memory access through FFM is loaded on Java 22+ only
                Require-Capability:     osgi.ee;filter:="(&(osgi.ee=JavaSE)(version=17))"
                -noee: true
                -exportcontents: org.tools4j.mmap.core.*
                # Suppress headers that reduce reproducibility.
                -reproducible: true
                -noextraheaders: true
            """
        }
    }

    mavenPublishing {
        publishToMavenCentral()
        signAllPublications()
        pom(projectPom)
    }
}

