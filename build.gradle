import java.time.Year

buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
    id 'idea'
    id 'java-library'
    id 'com.diffplug.spotless' version '8.10.4' apply false
    id 'biz.aQute.bnd.builder' version '7.4.0' apply false
    id 'com.vanniktech.maven.publish' version '0.37.0' apply false
}

defaultTasks 'clean', 'build'

def projGroup = 'org.tools4j'
def projVersion = file('version.txt').text.trim()

def agronaVersion = '2.7.0'
def slf4jVersion = '2.0.20'
def junitVersion = '6.1.3'
def mockitoVersion = '5.24.0'
def assertjVersion = '3.27.7'
def hdrHistogramVersion = '2.2.2'
def jmhVersion = '1.37'
def chronicleVersion = '5.21.98'//fastest now??
//def chronicleVersion = '5.23.37'

static def getBuildJavaVersion() {
    def buildJavaVersion = JavaVersion.current().getMajorVersion()
    if (buildJavaVersion.indexOf('.') > 0) {
        buildJavaVersion = buildJavaVersion.substring(0, buildJavaVersion.indexOf('.'))
    }
    if (buildJavaVersion.indexOf('-') > 0) {
        buildJavaVersion = buildJavaVersion.substring(0, buildJavaVersion.indexOf('-'))
    }
    Integer.parseInt(buildJavaVersion)
}
int buildJavaVersion = getBuildJavaVersion()

ext {
    //gradle clean build publishToMavenCentral -PmavenCentralUsername=xxx -PmavenCentralPassword=xxx
    //(or set mavenCentralUsername/mavenCentralPassword, plus signing.* properties, in ~/.gradle/gradle.properties)
    //then: login/verify/release in https://central.sonatype.com/publishing/deployments

    isReleaseVersion = !projVersion.endsWith('-SNAPSHOT')

    println name + " version=" + projVersion + " release=" + isReleaseVersion
}

def projectPom = {
    name = 'mmap'
    // optionally artifactId can be defined here
    description = 'Memory mapped files used to implement off-heap low latency utilities such as queues'
    url = 'https://github.com/tools4j/mmap'

    scm {
        connection = 'scm:git:https://github.com/tools4j/mmap.git'
        developerConnection = 'scm:git:https://github.com/tools4j/mmap.git'
        url = 'https://github.com/tools4j/mmap.git'
    }

    licenses {
        license {
            name = 'The MIT License (MIT)'
            url = 'https://opensource.org/licenses/MIT'
        }
    }

    developers {
        developer {
            id = 'anton-anufriev'
            name = 'Antun Anufriev'
            email = 'anufriev@gmail.com'
            url = 'https://github.com/anton-anufriev'
        }
        developer {
            id = 'terzerm'
            name = 'Marco Terzer'
            email = 'terzerm@gmail.com'
            url = 'https://github.com/terzerm'
        }
    }
}

jar.enabled = false

allprojects {
    repositories {
        mavenCentral()
        mavenLocal()
    }
}

//all modules are published to maven central; mmap-perf is a command line application, not an OSGi bundle
def libraryProjects = subprojects.findAll { it.name != 'mmap-perf' }

configure(libraryProjects) {
    apply plugin: 'java-library'
    apply plugin: 'biz.aQute.bnd.builder'
}

subprojects {
    apply plugin: 'com.vanniktech.maven.publish'
    apply plugin: 'signing'

    signing {
        useGpgCmd()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'jacoco'

    dependencies {
        testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
        testImplementation "org.junit.jupiter:junit-jupiter-params:${junitVersion}"
        testImplementation "org.assertj:assertj-core:${assertjVersion}"
        testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    }

    group = projGroup
    version = projVersion

    tasks.withType(Jar).configureEach {
        enabled = true
        includeEmptyDirs = false
    }

    tasks.withType(JavaCompile) {
        if (JavaVersion.current().isJava9Compatible()) {
            options.compilerArgs.addAll(['--add-exports', 'java.base/java.lang.reflect=ALL-UNNAMED'])
            options.compilerArgs.addAll(['--add-exports', 'java.base/java.net=ALL-UNNAMED'])
            options.compilerArgs.addAll(['--add-exports', 'java.base/sun.nio.ch=ALL-UNNAMED'])
            options.compilerArgs.addAll(['--add-exports', 'java.base/jdk.internal.ref=ALL-UNNAMED'])
            options.compilerArgs.addAll(['--add-exports', 'jdk.unsupported/sun.misc=ALL-UNNAMED'])
        }
        options.encoding = 'UTF-8'
        options.deprecation = true
    }

    tasks.withType(Test) {

        enableAssertions = true
        jvmArgs('-Ddisable.thread.safety=true')

        jvmArgs('--add-opens', 'java.base/jdk.internal.misc=ALL-UNNAMED')
        jvmArgs('--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED')

        useJUnitPlatform {
            excludeTags 'perf'
        }

        testLogging {
            showStandardStreams = true
            exceptionFormat = 'full'
        }

        reports.html.required = false // Disable individual test reports
    }

    task perfTest(type: Test) {
        maxParallelForks = 1
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        jacoco.enabled = false

        enableAssertions = false
        jvmArgs('-Djvm.resource.tracing=false')
        jvmArgs('-Ddisable.thread.safety=true')

        if (JavaVersion.current().isJava9Compatible()) {
            jvmArgs('--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED')
            jvmArgs('--add-opens', 'java.base/java.net=ALL-UNNAMED')
            jvmArgs('--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED')
            jvmArgs('--add-opens', 'java.base/jdk.internal.ref=ALL-UNNAMED')
            jvmArgs('--add-opens', 'java.base/java.util.zip=ALL-UNNAMED')
            jvmArgs('--add-exports', 'jdk.unsupported/sun.misc=ALL-UNNAMED')
        }

        useJUnitPlatform {
            excludeTags = [] as Set // inherited from tasks.withType(Test) above
            includeTags 'perf'
        }
    }

    task profilerTest(type: Test) {
        maxParallelForks = 1
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        jacoco.enabled = false

        enableAssertions = false
        jvmArgs('-Djvm.resource.tracing=false')
        jvmArgs('-agentpath:/Applications/JProfiler.app/Contents/Resources/app/bin/macos/libjprofilerti.jnilib=port=8849')

        useJUnitPlatform {
            excludeTags = [] as Set // inherited from tasks.withType(Test) above
            includeTags 'perf'
        }
    }

    jacoco {
        toolVersion = '0.8.16'
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
        }
    }

    spotless {
        def headerText = '/*\n' + file("${rootDir}/etc/LICENSE.template").readLines()
                .collect { it.isEmpty() ? ' *' : ' * ' + it }
                .join('\n')
                .replace('${year}', String.valueOf(Year.now().value)) + '\n */\n'
        java {
            licenseHeader(headerText)
        }
        // spotless java{} always skips package-info.java; '/**' delimiter keeps its package javadoc
        format 'packageInfo', {
            target 'src/*/java/**/package-info.java'
            licenseHeader(headerText, '(/\\*\\*|package )')
        }
    }

    compileJava.dependsOn spotlessApply

    javadoc {
        title = '<h1>mmap</h1>'
        options.bottom = "<i>Copyright &#169; 2020-" + Year.now().getValue() + " tools4j.org (Marco Terzer, Anton Anufriev). All Rights Reserved.</i>"
        options.encoding = 'UTF-8'
        options.docEncoding = 'UTF-8'
        options.charSet = 'UTF-8'
        if (JavaVersion.current().isJava10Compatible()) {
            options.addBooleanOption 'html5', true
            options.links("https://docs.oracle.com/en/java/javase/${buildJavaVersion}/docs/api/")
        }
        //doclint checks only the public api and config packages, which application code uses, and all of mmap-perf
        def basePackage = 'org.tools4j.' + project.name.replace('-', '.')
        def doclintPackages = project.name == 'mmap-perf' ? basePackage : "${basePackage}.api,${basePackage}.config"
        options.addBooleanOption('Xdoclint:all', true)
        options.addBooleanOption("Xdoclint/package:${doclintPackages}", true)
        options.addStringOption('Xmaxwarns', '10000')
        //fail on any doclint warning, i.e. on missing or broken documentation in the public packages
        options.addBooleanOption('Werror', true)
    }

    task testJar(type: Jar, dependsOn: testClasses) {
        archiveClassifier.set "test-${base.archivesName}"
        from sourceSets.test.output
    }

    configurations {
        tests
    }

    artifacts {
        tests testJar
    }
}

project(':mmap-core') {
    //JMH benchmarks of buffer prototypes, compiled with Java 25 for FFM and run with it, or with -PjmhJava=<version>:
    //./gradlew :mmap-core:jmh -Pjmh='BufferLoopBenchmark -f 1'
    sourceSets {
        jmh {}
    }

    dependencies {
        jmhImplementation "org.agrona:agrona:${agronaVersion}"
        jmhImplementation "org.openjdk.jmh:jmh-core:${jmhVersion}"
        jmhAnnotationProcessor "org.openjdk.jmh:jmh-generator-annprocess:${jmhVersion}"
    }

    tasks.named('compileJmhJava') {
        javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
    }

    tasks.register('jmh', JavaExec) {
        description = 'Runs the JMH benchmarks with the JMH command line arguments given by -Pjmh'
        classpath = sourceSets.jmh.runtimeClasspath
        mainClass = 'org.openjdk.jmh.Main'
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of((project.findProperty('jmhJava') ?: '25').toString())
        }
        args((project.findProperty('jmh') ?: '').toString().tokenize())
    }
}

project(':mmap-mapping') {
    dependencies {
        api "org.agrona:agrona:${agronaVersion}"
        //optional: logging listeners use SLF4J if present on the class path, and java.util.logging otherwise
        compileOnly "org.slf4j:slf4j-api:${slf4jVersion}"
        testImplementation "org.slf4j:slf4j-api:${slf4jVersion}"
        testRuntimeOnly "org.slf4j:slf4j-simple:${slf4jVersion}"
    }

    jar {
        bundle {
            // workaround for https://github.com/bndtools/bnd/issues/6346
            properties.put("project.group", provider({project.group}))
            bnd """
                Automatic-Module-Name:  org.tools4j.mmap.mapping
                Bundle-Name:            org.tools4j.mmap.mapping
                Bundle-SymbolicName:    org.tools4j.mmap.mapping
                Implementation-Title:   mmap
                Implementation-Vendor:  tools4j.org
                Implementation-Version: ${projVersion}
                Import-Package:         org.slf4j.*;resolution:=optional, *
                -exportcontents: org.tools4j.mmap, org.tools4j.mmap.*
                # Suppress headers that reduce reproducibility.
                -reproducible: true
                -noextraheaders: true
            """
        }
    }

    mavenPublishing {
        publishToMavenCentral()
        signAllPublications()
        pom(projectPom)
    }
}

project(':mmap-queue') {
    dependencies {
        api "org.agrona:agrona:${agronaVersion}"
        api project(':mmap-mapping')

        testImplementation "org.slf4j:slf4j-api:${slf4jVersion}"
        testRuntimeOnly "org.slf4j:slf4j-simple:${slf4jVersion}"
    }

    jar {
        bundle {
            // workaround for https://github.com/bndtools/bnd/issues/6346
            properties.put("project.group", provider({project.group}))
            bnd """
                Automatic-Module-Name:  org.tools4j.mmap.queue
                Bundle-Name:            org.tools4j.mmap.queue
                Bundle-SymbolicName:    org.tools4j.mmap.queue
                Implementation-Title:   mmap
                Implementation-Vendor:  tools4j.org
                Implementation-Version: ${projVersion}
                -exportcontents: org.tools4j.mmap, org.tools4j.mmap.*
                # Suppress headers that reduce reproducibility.
                -reproducible: true
                -noextraheaders: true
            """
        }
    }

    mavenPublishing {
        publishToMavenCentral()
        signAllPublications()
        pom(projectPom)
    }
}

project(':mmap-perf') {
    apply plugin: 'application'

    //JVM args for the mmap and chronicle queues, see https://chronicle.software/chronicle-support-java-17/
    def perfJvmArgs = [
            '-Dorg.slf4j.simpleLogger.defaultLogLevel=warn',
            '--add-opens', 'java.base/jdk.internal.misc=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
            '--add-opens', 'java.base/java.io=ALL-UNNAMED',
            '--add-opens', 'java.base/java.net=ALL-UNNAMED',
            '--add-opens', 'java.base/java.nio=ALL-UNNAMED',
            '--add-opens', 'java.base/java.util=ALL-UNNAMED',
            '--add-opens', 'java.base/java.util.zip=ALL-UNNAMED',
            '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED',
            '--add-opens', 'java.base/jdk.internal.ref=ALL-UNNAMED',
            '--add-opens', 'jdk.compiler/com.sun.tools.javac=ALL-UNNAMED',
            '--add-exports', 'java.base/jdk.internal.ref=ALL-UNNAMED',
            '--add-exports', 'java.base/sun.nio.ch=ALL-UNNAMED',
            '--add-exports', 'jdk.unsupported/sun.misc=ALL-UNNAMED',
            '--add-exports', 'jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED'
    ]

    //chronicle-queue is optional in the published pom, but on the main class paths and in the distribution
    java {
        registerFeature('chronicle') {
            usingSourceSet(sourceSets.main)
        }
    }

    dependencies {
        implementation project(':mmap-queue')
        implementation "org.hdrhistogram:HdrHistogram:${hdrHistogramVersion}"
        chronicleImplementation "net.openhft:chronicle-queue:${chronicleVersion}"
        runtimeOnly "org.slf4j:slf4j-simple:${slf4jVersion}"
    }

    //the chronicle-queue version named by QueuePerf if chronicle is not on the class path
    processResources {
        inputs.property('chronicleVersion', chronicleVersion)
        filesMatching('**/chronicle.properties') {
            expand(chronicleVersion: chronicleVersion)
        }
    }

    application {
        mainClass = 'org.tools4j.mmap.perf.QueuePerf'
        applicationDefaultJvmArgs = perfJvmArgs
    }

    tasks.withType(Test).configureEach {
        jvmArgs(perfJvmArgs)
    }

    //run with: ./gradlew :mmap-perf:run --args='--help'
    tasks.named('run') {
        enableAssertions = false
    }

    //executable with java -jar from the lib directory of installDist, see README
    jar {
        archiveVersion = ''
        def modulePackages = { option ->
            (0..<perfJvmArgs.size()).findAll { perfJvmArgs[it] == option }
                    .collect { perfJvmArgs[it + 1] - '=ALL-UNNAMED' }
                    .join(' ')
        }
        manifest {
            attributes(
                    'Main-Class': 'org.tools4j.mmap.perf.QueuePerf',
                    'Add-Opens': modulePackages('--add-opens'),
                    'Add-Exports': modulePackages('--add-exports'),
                    'Enable-Native-Access': 'ALL-UNNAMED'
            )
        }
        doFirst {
            manifest.attributes('Class-Path': configurations.runtimeClasspath.files*.name.join(' '))
        }
    }

    mavenPublishing {
        publishToMavenCentral()
        signAllPublications()
        pom(projectPom)
        pom {
            description = 'Command line benchmark measuring mmap and Chronicle Queue latencies through the same harness'
        }
    }

    //the distribution zip, ready to run with all dependencies, published next to the jar as mmap-perf-<version>.zip
    publishing {
        publications.withType(MavenPublication).configureEach {
            artifact(distZip)
        }
    }
}

tasks.register('testReport', TestReport) {
    destinationDirectory = file("${rootDir}/reports/allTests")
    // Include the results from the `test` task in all sub-projects
    testResults.setFrom(subprojects*.test)
}

//prints a draft of the next CHANGELOG.md entry from the commit subjects since the last release tag, grouped by their
//leading verb, to curate by hand: ./gradlew -q changelogDraft
tasks.register('changelogDraft') {
    group = 'documentation'
    description = 'Prints a CHANGELOG.md draft from the commits since the last release tag'
    def lastTag = providers.exec { commandLine 'git', 'describe', '--tags', '--abbrev=0' }
            .standardOutput.asText.map { it.trim() }
    def commits = lastTag.flatMap { tag ->
        providers.exec { commandLine 'git', 'log', '--no-merges', '--format=%h %s', "${tag}..HEAD" }
                .standardOutput.asText
    }
    doLast {
        //first match wins, so test and CI commits are recognised before their leading verb
        def sections = [
                'Tests and CI (usually omitted)': ~/(?i)^CI\b.*|.*\btests?\b.*|.*\bperfTest\b.*/,
                'Added'                         : ~/^(Add|Support|Introduce)\b.*/,
                'Fixed'                         : ~/^Fix\b.*/,
                'Removed'                       : ~/^(Remove|Drop|Delete)\b.*/,
                'Dependencies'                  : ~/^(Upgrade|Bump)\b.*/,
        ]
        def grouped = [:].withDefault { [] }
        commits.get().readLines().findAll { it.trim() }.each { line ->
            def (hash, subject) = [line.substring(0, line.indexOf(' ')), line.substring(line.indexOf(' ') + 1)]
            def section = sections.find { name, pattern -> subject ==~ pattern }?.key ?: 'Changed'
            grouped[section] << "- ${subject} (${hash})"
        }
        println "## ${projVersion.replace('-SNAPSHOT', '')} (unreleased), commits since ${lastTag.get()}"
        ['Added', 'Changed', 'Fixed', 'Removed', 'Dependencies', sections.keySet().first()].each { section ->
            if (grouped[section]) {
                println "\n### ${section}"
                grouped[section].each { println it }
            }
        }
    }
}

wrapper {
    gradleVersion = '9.8.2'
    distributionType = 'ALL'
}