project(':mmap-perf') {
    apply plugin: 'application'

    //JVM args for the mmap and chronicle queues, see https://chronicle.software/chronicle-support-java-17/
    def perfJvmArgs = [
            '-Dorg.slf4j.simpleLogger.defaultLogLevel=warn',
            '--add-opens', 'java.base/jdk.internal.misc=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
            '--add-opens', 'java.base/java.io=ALL-UNNAMED',
            '--add-opens', 'java.base/java.net=ALL-UNNAMED',
            '--add-opens', 'java.base/java.nio=ALL-UNNAMED',
            '--add-opens', 'java.base/java.util=ALL-UNNAMED',
            '--add-opens', 'java.base/java.util.zip=ALL-UNNAMED',
            '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED',
            '--add-opens', 'java.base/jdk.internal.ref=ALL-UNNAMED',
            '--add-opens', 'jdk.compiler/com.sun.tools.javac=ALL-UNNAMED',
            '--add-exports', 'java.base/jdk.internal.ref=ALL-UNNAMED',
            '--add-exports', 'java.base/sun.nio.ch=ALL-UNNAMED',
            '--add-exports', 'jdk.unsupported/sun.misc=ALL-UNNAMED',
            '--add-exports', 'jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED'
    ]

    //chronicle-queue is optional in the published pom, but on the main class paths and in the distribution
    java {
        registerFeature('chronicle') {
            usingSourceSet(sourceSets.main)
        }
    }

    dependencies {
        implementation project(':mmap-queue')
        implementation "org.hdrhistogram:HdrHistogram:${hdrHistogramVersion}"
        chronicleImplementation "net.openhft:chronicle-queue:${chronicleVersion}"
        runtimeOnly "org.slf4j:slf4j-simple:${slf4jVersion}"
    }

    //the chronicle-queue version named by QueuePerf if chronicle is not on the class path
    processResources {
        inputs.property('chronicleVersion', chronicleVersion)
        filesMatching('**/chronicle.properties') {
            expand(chronicleVersion: chronicleVersion)
        }
    }

    application {
        mainClass = 'org.tools4j.mmap.perf.QueuePerf'
        applicationDefaultJvmArgs = perfJvmArgs
    }

    tasks.withType(Test).configureEach {
        jvmArgs(perfJvmArgs)
    }

    //run with: ./gradlew :mmap-perf:run --args='--help'
    tasks.named('run') {
        enableAssertions = false
    }

    //executable with java -jar from the lib directory of installDist, see README
    jar {
        archiveVersion = ''
        def modulePackages = { option ->
            (0..<perfJvmArgs.size()).findAll { perfJvmArgs[it] == option }
                    .collect { perfJvmArgs[it + 1] - '=ALL-UNNAMED' }
                    .join(' ')
        }
        manifest {
            attributes(
                    'Main-Class': 'org.tools4j.mmap.perf.QueuePerf',
                    'Add-Opens': modulePackages('--add-opens'),
                    'Add-Exports': modulePackages('--add-exports'),
                    'Enable-Native-Access': 'ALL-UNNAMED'
            )
        }
        doFirst {
            manifest.attributes('Class-Path': configurations.runtimeClasspath.files*.name.join(' '))
        }
    }

    mavenPublishing {
        publishToMavenCentral()
        signAllPublications()
        pom(projectPom)
        pom {
            description = 'Command line benchmark measuring mmap and Chronicle Queue latencies through the same harness'
        }
    }

    //the distribution zip, ready to run with all dependencies, published next to the jar as mmap-perf-<version>.zip
    publishing {
        publications.withType(MavenPublication).configureEach {
            artifact(distZip)
        }
    }
}

tasks.register('testReport', TestReport) {
    destinationDirectory = file("${rootDir}/reports/allTests")
    // Include the results from the `test` task in all sub-projects
    testResults.setFrom(subprojects*.test)
}

//prints a draft of the next CHANGELOG.md entry from the commit subjects since the last release tag, grouped by their
//leading verb, to curate by hand: ./gradlew -q changelogDraft
tasks.register('changelogDraft') {
    group = 'documentation'
    description = 'Prints a CHANGELOG.md draft from the commits since the last release tag'
    def lastTag = providers.exec { commandLine 'git', 'describe', '--tags', '--abbrev=0' }
            .standardOutput.asText.map { it.trim() }
    def commits = lastTag.flatMap { tag ->
        providers.exec { commandLine 'git', 'log', '--no-merges', '--format=%h %s', "${tag}..HEAD" }
                .standardOutput.asText
    }
    doLast {
        //first match wins, so test and CI commits are recognised before their leading verb
        def sections = [
                'Tests and CI (usually omitted)': ~/(?i)^CI\b.*|.*\btests?\b.*|.*\bperfTest\b.*/,
                'Added'                         : ~/^(Add|Support|Introduce)\b.*/,
                'Fixed'                         : ~/^Fix\b.*/,
                'Removed'                       : ~/^(Remove|Drop|Delete)\b.*/,
                'Dependencies'                  : ~/^(Upgrade|Bump)\b.*/,
        ]
        def grouped = [:].withDefault { [] }
        commits.get().readLines().findAll { it.trim() }.each { line ->
            def (hash, subject) = [line.substring(0, line.indexOf(' ')), line.substring(line.indexOf(' ') + 1)]
            def section = sections.find { name, pattern -> subject ==~ pattern }?.key ?: 'Changed'
            grouped[section] << "- ${subject} (${hash})"
        }
        println "## ${projVersion.replace('-SNAPSHOT', '')} (unreleased), commits since ${lastTag.get()}"
        ['Added', 'Changed', 'Fixed', 'Removed', 'Dependencies', sections.keySet().first()].each { section ->
            if (grouped[section]) {
                println "\n### ${section}"
                grouped[section].each { println it }
            }
        }
    }
}

