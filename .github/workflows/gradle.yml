name: build
on:
  repository_dispatch:
    types: run-commit-tests
  push:
    branches:
      - master
      - feature/**
      - release/**
  pull_request:
    types: [opened, synchronize]
    branches:
      - master
      - feature/**
      - release/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.java.installations.auto-detect=false -Dorg.gradle.warning.mode=fail'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.java.installations.auto-detect=false -Dorg.gradle.warning.mode=summary'

permissions:
  contents: read

jobs:
  java-build:
    name: Java ${{ matrix.java }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # newest GA JDK may be ahead of what the Gradle version supports; report it but don't fail the run
    continue-on-error: ${{ matrix.java == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21', '25', 'latest' ]
        os: ['ubuntu-latest', 'windows-latest']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-caches-${{ hashFiles('**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-caches-
      - name: Cache Gradle wrappers
        uses: actions/cache@v6
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
      - name: Setup BUILD_JAVA_HOME & BUILD_JAVA_VERSION (Linux)
        if: runner.os == 'Linux'
        run: |
          java -Xinternalversion
          echo "BUILD_JAVA_HOME=${JAVA_HOME}" >> $GITHUB_ENV
          echo "BUILD_JAVA_VERSION=${{ matrix.java }}" >> $GITHUB_ENV
      - name: Setup BUILD_JAVA_HOME & BUILD_JAVA_VERSION (Windows)
        if: runner.os == 'Windows'
        run: |
          java -Xinternalversion
          echo "BUILD_JAVA_HOME=$env:JAVA_HOME" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          echo "BUILD_JAVA_VERSION=${{ matrix.java }}" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Setup java to run the Gradle script
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
      - name: Build with Gradle
        run: ./gradlew
      - name: Generate coverage reports
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        run: ./gradlew jacocoTestReport
      - name: Upload mmap-mapping coverage to Coveralls
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        uses: coverallsapp/github-action@v2
        with:
          file: mmap-mapping/build/reports/jacoco/test/jacocoTestReport.xml
          format: jacoco
          base-path: mmap-mapping/src/main/java
          flag-name: mmap-mapping
          parallel: true
          fail-on-error: false
      - name: Upload mmap-queue coverage to Coveralls
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        uses: coverallsapp/github-action@v2
        with:
          file: mmap-queue/build/reports/jacoco/test/jacocoTestReport.xml
          format: jacoco
          base-path: mmap-queue/src/main/java
          flag-name: mmap-queue
          parallel: true
          fail-on-error: false
      - name: Finish Coveralls upload
        if: matrix.os == 'ubuntu-latest' && matrix.java == '21'
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
          fail-on-error: false

  # built on Java 25 like a release, tested on Java 17: class files compiled against a newer JDK may call JDK
  # internals whose signatures differ on older versions, which the builds above, each testing on its own JDK, miss
  release-build-on-java-17:
    name: Java 25 build tested on Java 17 (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Cache Gradle dependencies
        uses: actions/cache@v6
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-caches-${{ hashFiles('**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-caches-
      - name: Cache Gradle wrappers
        uses: actions/cache@v6
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Setup java 17 for the tests and 25 for the build
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: |
            17
            25
      - name: Build with Gradle on Java 25, testing on Java 17
        run: ./gradlew -PtestJava=17 -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64
