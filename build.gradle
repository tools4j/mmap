import java.time.Year

buildscript {
    repositories {
        mavenCentral()
    }
}

plugins {
    id 'idea'
    id 'java-library'
    id 'com.diffplug.spotless' version '8.10.4' apply false
    id 'biz.aQute.bnd.builder' version '7.4.0' apply false
    id 'com.vanniktech.maven.publish' version '0.37.0' apply false
}

defaultTasks 'clean', 'build'

def projGroup = 'org.tools4j'
def projVersion = file('version.txt').text.trim()

def agronaVersion = '2.7.0'
def slf4jVersion = '2.0.20'
def junitVersion = '6.1.3'
def mockitoVersion = '5.24.0'
def assertjVersion = '3.27.7'
def hdrHistogramVersion = '2.2.2'
def chronicleVersion = '5.21.98'//fastest now??
//def chronicleVersion = '5.23.37'

static def getBuildJavaVersion() {
    def buildJavaVersion = JavaVersion.current().getMajorVersion()
    if (buildJavaVersion.indexOf('.') > 0) {
        buildJavaVersion = buildJavaVersion.substring(0, buildJavaVersion.indexOf('.'))
    }
    if (buildJavaVersion.indexOf('-') > 0) {
        buildJavaVersion = buildJavaVersion.substring(0, buildJavaVersion.indexOf('-'))
    }
    Integer.parseInt(buildJavaVersion)
}
int buildJavaVersion = getBuildJavaVersion()

ext {
    //gradle clean build publishToMavenCentral -PmavenCentralUsername=xxx -PmavenCentralPassword=xxx
    //(or set mavenCentralUsername/mavenCentralPassword, plus signing.* properties, in ~/.gradle/gradle.properties)

    isReleaseVersion = !projVersion.endsWith('-SNAPSHOT')

    println name + " version=" + projVersion + " release=" + isReleaseVersion
}

def projectPom = {
    name = 'mmap'
    // optionally artifactId can be defined here
    description = 'Memory mapped files used to implement off-heap low latency utilities such as queues'
    url = 'https://github.com/tools4j/mmap'

    scm {
        connection = 'scm:git:https://github.com/tools4j/mmap.git'
        developerConnection = 'scm:git:https://github.com/tools4j/mmap.git'
        url = 'https://github.com/tools4j/mmap.git'
    }

    licenses {
        license {
            name = 'The MIT License (MIT)'
            url = 'https://opensource.org/licenses/MIT'
        }
    }

    developers {
        developer {
            id = 'anton-anufriev'
            name = 'Antun Anufriev'
            email = 'anufriev@gmail.com'
            url = 'https://github.com/anton-anufriev'
        }
        developer {
            id = 'terzerm'
            name = 'Marco Terzer'
            email = 'terzerm@gmail.com'
            url = 'https://github.com/terzerm'
        }
    }
}

jar.enabled = false

allprojects {
    repositories {
        mavenCentral()
        mavenLocal()
    }
}

//the library modules, published to maven central; mmap-perf is a command line application that is not published
def libraryProjects = subprojects.findAll { it.name != 'mmap-perf' }

configure(libraryProjects) {
    apply plugin: 'java-library'
    apply plugin: 'com.vanniktech.maven.publish'
    apply plugin: 'signing'
    apply plugin: 'biz.aQute.bnd.builder'

    signing {
        useGpgCmd()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'jacoco'

    dependencies {
        testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
        testImplementation "org.junit.jupiter:junit-jupiter-params:${junitVersion}"
        testImplementation "org.assertj:assertj-core:${assertjVersion}"
        testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    }

    group = projGroup
    version = projVersion

    tasks.withType(Jar).configureEach {
        enabled = true
        includeEmptyDirs = false
    }

    tasks.withType(JavaCompile) {
        if (JavaVersion.current().isJava9Compatible()) {
            options.compilerArgs.addAll(['--add-exports', 'java.base/java.lang.reflect=ALL-UNNAMED'])
            options.compilerArgs.addAll(['--add-exports', 'java.base/java.net=ALL-UNNAMED'])
            options.compilerArgs.addAll(['--add-exports', 'java.base/sun.nio.ch=ALL-UNNAMED'])
            options.compilerArgs.addAll(['--add-exports', 'java.base/jdk.internal.ref=ALL-UNNAMED'])
            options.compilerArgs.addAll(['--add-exports', 'jdk.unsupported/sun.misc=ALL-UNNAMED'])
        }
        options.encoding = 'UTF-8'
        options.deprecation = true
    }

    tasks.withType(Test) {

        enableAssertions = true
        jvmArgs('-Ddisable.thread.safety=true')

        jvmArgs('--add-opens', 'java.base/jdk.internal.misc=ALL-UNNAMED')
        jvmArgs('--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED')

        useJUnitPlatform {
            excludeTags 'perf'
        }

        testLogging {
            showStandardStreams = true
            exceptionFormat = 'full'
        }

        reports.html.required = false // Disable individual test reports
    }

    task perfTest(type: Test) {
        maxParallelForks = 1
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        jacoco.enabled = false

        enableAssertions = false
        jvmArgs('-Djvm.resource.tracing=false')
        jvmArgs('-Ddisable.thread.safety=true')

        if (JavaVersion.current().isJava9Compatible()) {
            jvmArgs('--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED')
            jvmArgs('--add-opens', 'java.base/java.net=ALL-UNNAMED')
            jvmArgs('--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED')
            jvmArgs('--add-opens', 'java.base/jdk.internal.ref=ALL-UNNAMED')
            jvmArgs('--add-opens', 'java.base/java.util.zip=ALL-UNNAMED')
            jvmArgs('--add-exports', 'jdk.unsupported/sun.misc=ALL-UNNAMED')
        }

        useJUnitPlatform {
            excludeTags = [] as Set // inherited from tasks.withType(Test) above
            includeTags 'perf'
        }
    }

    task profilerTest(type: Test) {
        maxParallelForks = 1
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        jacoco.enabled = false

        enableAssertions = false
        jvmArgs('-Djvm.resource.tracing=false')
        jvmArgs('-agentpath:/Applications/JProfiler.app/Contents/Resources/app/bin/macos/libjprofilerti.jnilib=port=8849')

        useJUnitPlatform {
            excludeTags = [] as Set // inherited from tasks.withType(Test) above
            includeTags 'perf'
        }
    }

    jacoco {
        toolVersion = '0.8.16'
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
        }
    }

    spotless {
        def headerText = '/*\n' + file("${rootDir}/etc/LICENSE.template").readLines()
                .collect { it.isEmpty() ? ' *' : ' * ' + it }
                .join('\n')
                .replace('${year}', String.valueOf(Year.now().value)) + '\n */\n'
        java {
            licenseHeader(headerText)
        }
        // spotless java{} always skips package-info.java; '/**' delimiter keeps its package javadoc
        format 'packageInfo', {
            target 'src/*/java/**/package-info.java'
            licenseHeader(headerText, '(/\\*\\*|package )')
        }
    }

    compileJava.dependsOn spotlessApply

    javadoc {
        title = '<h1>mmap</h1>'
        options.bottom = "<i>Copyright &#169; 2020-" + Year.now().getValue() + " tools4j.org (Marco Terzer, Anton Anufriev). All Rights Reserved.</i>"
        options.encoding = 'UTF-8'
        options.docEncoding = 'UTF-8'
        options.charSet = 'UTF-8'
        if (JavaVersion.current().isJava10Compatible()) {
            options.addBooleanOption 'html5', true
            options.links("https://docs.oracle.com/en/java/javase/${buildJavaVersion}/docs/api/")
        }
        //doclint checks only the public api and config packages, which application code uses
        def basePackage = 'org.tools4j.' + project.name.replace('-', '.')
        options.addBooleanOption('Xdoclint:all', true)
        options.addBooleanOption("Xdoclint/package:${basePackage}.api,${basePackage}.config", true)
        options.addStringOption('Xmaxwarns', '10000')
        //fail on any doclint warning, i.e. on missing or broken documentation in the api and config packages
        options.addBooleanOption('Werror', true)
    }

    task testJar(type: Jar, dependsOn: testClasses) {
        archiveClassifier.set "test-${base.archivesName}"
        from sourceSets.test.output
    }

    configurations {
        tests
    }

    artifacts {
        tests testJar
    }
}

project(':mmap-mapping') {
    dependencies {
        api "org.agrona:agrona:${agronaVersion}"
        //optional: logging listeners use SLF4J if present on the class path, and java.util.logging otherwise
        compileOnly "org.slf4j:slf4j-api:${slf4jVersion}"
        testImplementation "org.slf4j:slf4j-api:${slf4jVersion}"
        testRuntimeOnly "org.slf4j:slf4j-simple:${slf4jVersion}"
    }

    jar {
        bundle {
            // workaround for https://github.com/bndtools/bnd/issues/6346
            properties.put("project.group", provider({project.group}))
            bnd """
                Automatic-Module-Name:  org.tools4j.mmap.mapping
                Bundle-Name:            org.tools4j.mmap.mapping
                Bundle-SymbolicName:    org.tools4j.mmap.mapping
                Implementation-Title:   mmap
                Implementation-Vendor:  tools4j.org
                Implementation-Version: ${projVersion}
                Import-Package:         org.slf4j.*;resolution:=optional, *
                -exportcontents: org.tools4j.mmap, org.tools4j.mmap.*
                # Suppress headers that reduce reproducibility.
                -reproducible: true
                -noextraheaders: true
            """
        }
    }

    mavenPublishing {
        publishToMavenCentral()
        signAllPublications()
        pom(projectPom)
    }
}

project(':mmap-queue') {
    dependencies {
        api "org.agrona:agrona:${agronaVersion}"
        api project(':mmap-mapping')

        testImplementation "org.slf4j:slf4j-api:${slf4jVersion}"
        testRuntimeOnly "org.slf4j:slf4j-simple:${slf4jVersion}"
    }

    jar {
        bundle {
            // workaround for https://github.com/bndtools/bnd/issues/6346
            properties.put("project.group", provider({project.group}))
            bnd """
                Automatic-Module-Name:  org.tools4j.mmap.queue
                Bundle-Name:            org.tools4j.mmap.queue
                Bundle-SymbolicName:    org.tools4j.mmap.queue
                Implementation-Title:   mmap
                Implementation-Vendor:  tools4j.org
                Implementation-Version: ${projVersion}
                -exportcontents: org.tools4j.mmap, org.tools4j.mmap.*
                # Suppress headers that reduce reproducibility.
                -reproducible: true
                -noextraheaders: true
            """
        }
    }

    mavenPublishing {
        publishToMavenCentral()
        signAllPublications()
        pom(projectPom)
    }
}

project(':mmap-perf') {
    apply plugin: 'application'

    //JVM args for the mmap and chronicle queues, see https://chronicle.software/chronicle-support-java-17/
    def perfJvmArgs = [
            '-Dorg.slf4j.simpleLogger.defaultLogLevel=warn',
            '--add-opens', 'java.base/jdk.internal.misc=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
            '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED',
            '--add-opens', 'java.base/java.io=ALL-UNNAMED',
            '--add-opens', 'java.base/java.net=ALL-UNNAMED',
            '--add-opens', 'java.base/java.nio=ALL-UNNAMED',
            '--add-opens', 'java.base/java.util=ALL-UNNAMED',
            '--add-opens', 'java.base/java.util.zip=ALL-UNNAMED',
            '--add-opens', 'java.base/sun.nio.ch=ALL-UNNAMED',
            '--add-opens', 'java.base/jdk.internal.ref=ALL-UNNAMED',
            '--add-opens', 'jdk.compiler/com.sun.tools.javac=ALL-UNNAMED',
            '--add-exports', 'java.base/jdk.internal.ref=ALL-UNNAMED',
            '--add-exports', 'java.base/sun.nio.ch=ALL-UNNAMED',
            '--add-exports', 'jdk.unsupported/sun.misc=ALL-UNNAMED',
            '--add-exports', 'jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED'
    ]

    dependencies {
        implementation project(':mmap-queue')
        implementation "org.hdrhistogram:HdrHistogram:${hdrHistogramVersion}"
        implementation "net.openhft:chronicle-queue:${chronicleVersion}"
        runtimeOnly "org.slf4j:slf4j-simple:${slf4jVersion}"
    }

    application {
        mainClass = 'org.tools4j.mmap.perf.QueuePerf'
        applicationDefaultJvmArgs = perfJvmArgs
    }

    tasks.withType(Test).configureEach {
        jvmArgs(perfJvmArgs)
    }

    //run with: ./gradlew :mmap-perf:run --args='--help'
    tasks.named('run') {
        enableAssertions = false
    }

    javadoc.enabled = false
}

tasks.register('testReport', TestReport) {
    destinationDirectory = file("${rootDir}/reports/allTests")
    // Include the results from the `test` task in all sub-projects
    testResults.setFrom(subprojects*.test)
}

wrapper {
    gradleVersion = '9.8.2'
    distributionType = 'ALL'
}